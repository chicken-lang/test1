# pnpm workspace 配置
# 多包结构: apps/web(用户端 Nuxt) / apps/admin(CMS) / apps/server(NestJS) / packages/shared(共享)
packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': set this to true or false
  esbuild: set this to true or false
  vue-demi: set this to true or false

# 允许执行构建脚本的依赖(Nuxt/Vite 需要的原生模块)
onlyBuiltDependencies:
  - esbuild
  - '@parcel/watcher'
  - vue-demi
  - '@nuxt/kit'
  - nuxt
