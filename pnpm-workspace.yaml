# pnpm workspace 配置
# 多包结构: apps/web(用户端 Nuxt) / apps/admin(CMS) / apps/server(NestJS) / packages/shared(共享)
packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
  workerd: true

# 允许执行构建脚本的依赖(Nuxt/Vite/图片处理/Cloudflare 需要的原生模块)
onlyBuiltDependencies:
  - esbuild
  - '@parcel/watcher'
  - vue-demi
  - '@nuxt/kit'
  - nuxt
  - sharp
  - workerd
  - unrs-resolver
